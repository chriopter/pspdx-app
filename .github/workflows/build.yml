name: Build EBOOT

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y libcjson-dev zlib1g-dev libssl-dev
      - run: sh dev/tests/run
      # The same pinned validator pspdx-catalog checks with, against the
      # schemas in this checkout: a schema and what it describes change in
      # one commit and are checked together.
      - name: Check against the schemas
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r dev/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" dev/check-schemas

  eboot:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read wolfSSL revision
        id: wolfssl-revision
        run: echo "commit=$(git -C app/lib/pspkit-https rev-parse HEAD:wolfssl)" >> "$GITHUB_OUTPUT"

      # wolfSSL is cached on everything that controls its source and build.
      - uses: actions/cache@v4
        id: wolfssl
        with:
          path: app/lib/pspkit-https/build/wolfssl
          key: wolfssl-${{ steps.wolfssl-revision.outputs.commit }}-${{ hashFiles('app/lib/pspkit-https/tools/build-wolfssl', 'app/lib/pspkit-https/src/wolfssl_seed.h') }}

      - name: Build wolfSSL
        if: steps.wolfssl.outputs.cache-hit != 'true'
        run: sh app/lib/pspkit-https/tools/build-wolfssl

      - name: Build
        run: make -C app

      - name: Check it is a PBP
        run: |
          eboot=app/EBOOT.PBP
          test -f "$eboot"
          head -c 4 "$eboot" | grep -q $'\x00PBP'
          ls -l "$eboot"

      - uses: actions/upload-artifact@v4
        with:
          name: pspdx-EBOOT
          path: app/EBOOT.PBP
