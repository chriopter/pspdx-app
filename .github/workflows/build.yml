name: Build EBOOT

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcjson-dev zlib1g-dev libssl-dev
      - run: sh app/tests/run

  eboot:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4

      # wolfSSL is built from a hash-pinned tarball with our seed flags.
      # Cached on the build script and the pinned hash inside it.
      - uses: actions/cache@v4
        id: wolfssl
        with:
          path: app/wolfssl-psp/prefix
          key: wolfssl-${{ hashFiles('app/wolfssl-psp/build.sh', 'app/wolfssl-psp/psprandom_decl.h') }}

      - name: Build wolfSSL
        if: steps.wolfssl.outputs.cache-hit != 'true'
        run: sh app/wolfssl-psp/build.sh

      - name: Build
        run: make -C app

      - name: Check it is a PBP
        run: |
          eboot=app/EBOOT.PBP
          test -f "$eboot"
          head -c 4 "$eboot" | grep -q $'\x00PBP'
          ls -l "$eboot"

      - uses: actions/upload-artifact@v4
        with:
          name: pspdx-EBOOT
          path: app/EBOOT.PBP
