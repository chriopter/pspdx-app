<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <!-- The turning arrows, in the family's manner: two arcs of a broken ring,
       each ending in a solid head twice the width of the arc it finishes,
       the second the first turned half around: Sony's update_plugin sign,
       redrawn at the UMD's size. Arc radius 6.70, stroke 2.30, 130.00 degrees each,
       heads 4.00 long. -->
  <defs>
    <g id="arm">
      <path d="M4.87 5.69 A6.70 6.70 0 0 1 16.60 8.84" fill="none" stroke="#ffffff" stroke-width="2.30"/>
      <path d="M14.33 9.24 L18.86 8.44 L17.29 12.78 Z" fill="#ffffff" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round"/>
    </g>
  </defs>
  <g transform="rotate(-45.00 10.00 10.00)">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(180 10.00 10.00)"/>
  </g>
</svg>
