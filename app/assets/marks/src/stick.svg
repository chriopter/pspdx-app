<svg xmlns="http://www.w3.org/2000/svg" width="13" height="17" viewBox="0 0 13 17">
  <!-- The Memory Stick: the outline of a card with its corner cut, and
       nothing inside it. Drawn to the same optical size as the tab signs
       beside it: the body nearly the cell's height and the stroke as
       heavy as theirs, so that a narrow shape does not read as a smaller one. -->
  <path d="M2 2 H7.6 L11 5.4 V15 H2 Z" fill="none" stroke="#ffffff"
        stroke-width="2" stroke-linejoin="round"/>
</svg>
